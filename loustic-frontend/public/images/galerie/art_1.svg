<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <rect width="400" height="500" fill="#2d3436" rx="20"/>
  <rect x="20" y="20" width="360" height="460" fill="#0c2461" stroke="#f5cd79" stroke-width="8" rx="16"/>
  <!-- Ciel étoilé & aurore -->
  <path d="M20,250 Q100,160 200,210 T380,180 L380,480 L20,480 Z" fill="#1e3799"/>
  <path d="M20,320 Q120,220 230,280 T380,240 L380,480 L20,480 Z" fill="#079992"/>
  <!-- Lune dorée -->
  <circle cx="300" cy="90" r="35" fill="#fbc531"/>
  <circle cx="288" cy="85" r="28" fill="#0c2461"/>
  <!-- Étoiles brillantes -->
  <circle cx="80" cy="80" r="4" fill="#ffffff"/>
  <circle cx="150" cy="60" r="3" fill="#ffffff"/>
  <circle cx="220" cy="110" r="5" fill="#fbc531"/>
  <circle cx="100" cy="140" r="3" fill="#ffffff"/>
  <!-- Silhouette montagneuse -->
  <polygon points="50,480 180,310 280,480" fill="#0a3d62"/>
  <polygon points="200,480 300,360 380,480" fill="#1e272e"/>
  <text x="200" y="450" font-family="Fredoka, serif" font-weight="700" font-size="22" fill="#fbc531" text-anchor="middle">L'Aurore Boréale ✨</text>
</svg>
