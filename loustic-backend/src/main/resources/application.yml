server:
  port: ${PORT:8080}

spring:
  application:
    name: loustic-backend

loustic:
  # Origines autorisées (frontend Vite en dev, IP locale pour téléphone, et domaine Vercel)
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://192.168.*.*:*"
      - "http://172.*.*:*"
      - "http://10.*.*:*"
      - "https://*.vercel.app"
      - "https://*.github.io"
  rooms:
    # Une salle sans activité depuis ce délai est supprimée
    idle-timeout-minutes: 60
    max-players: 12
  bomb:
    min-fuse-seconds: 18
    max-fuse-seconds: 45
